[env:c3]
; Pinned: unpinned espressif32 floats to 8.x (Arduino core 3.x, ~350KB bigger)
; and overflows the 0x150000 app slot. 7.1.3 is the last CI-green toolchain.
platform = espressif32@7.1.3
board = esp32-c3-devkitm-1
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:c3-single]
; Max-blocklist variant: single factory app (no firmware OTA rollback) + a
; ~2.75MB LittleFS. Firmware updates via USB only (esptool / web flasher);
; blocklist still updates over WiFi. See partitions-single.csv.
platform = espressif32@7.1.3
board = esp32-c3-devkitm-1
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = partitions-single.csv
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DSINGLE_APP=1

name: 9M2PJU ESP32-C3 AdBlocker
new_install_prompt_erase: true
builds:
  - name: esp32-c3
    chipFamily: ESP32-C3
    images:
      - path: https://github.com/9M2PJU/9M2PJU-ESP32-C3-AdBlocker/releases/latest/download/bootloader.bin
        offset: 0x1000
      - path: https://github.com/9M2PJU/9M2PJU-ESP32-C3-AdBlocker/releases/latest/download/partitions.bin
        offset: 0x8000
      - path: https://github.com/9M2PJU/9M2PJU-ESP32-C3-AdBlocker/releases/latest/download/firmware.bin
        offset: 0x10000
      - path: https://github.com/9M2PJU/9M2PJU-ESP32-C3-AdBlocker/releases/latest/download/blocklist-fs.bin
        offset: 0x2b0000

name: 9M2PJU ESP32-C3 AdBlocker
version: "1.0.5"
new_install_prompt_erase: true
builds:
  - name: esp32-c3
    chipFamily: ESP32-C3
    parts:
      - path: bootloader.bin
        offset: 0
      - path: partitions.bin
        offset: 32768
      - path: firmware.bin
        offset: 65536
      - path: blocklist-fs.bin
        offset: 2818048

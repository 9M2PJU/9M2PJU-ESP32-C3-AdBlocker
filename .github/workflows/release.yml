name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Create stub secrets.h
        run: cp src/secrets.example.h src/secrets.h

      - name: Build firmware
        run: pio run

      - name: Run blocklist tests
        run: |
          pip install cryptography
          python3 tools/test_build_blocklist.py

      - name: Build default blocklist (StevenBlack + Hagezi Light, ~140k domains)
        run: |
          mkdir -p data
          python3 tools/build_blocklist.py data/blocklist.bin

      - name: Sign blocklist (if signing key is configured)
        env:
          BLOCKLIST_SIGN_KEY: ${{ secrets.BLOCKLIST_SIGN_KEY }}
        run: |
          if [ -n "$BLOCKLIST_SIGN_KEY" ]; then
            echo "$BLOCKLIST_SIGN_KEY" > /tmp/bl_signing.pem
            chmod 600 /tmp/bl_signing.pem
            python3 tools/sign_blocklist.py sign data/blocklist.bin /tmp/bl_signing.pem
            rm -f /tmp/bl_signing.pem
            cp data/blocklist.bin.sig data/blocklist.sig
            ls -lh data/blocklist.bin.sig
          else
            echo "No BLOCKLIST_SIGN_KEY secret — publishing unsigned blocklist"
          fi

      - name: Build filesystem image
        run: pio run -t buildfs

      - name: Prepare release assets
        run: |
          mkdir -p release
          cp .pio/build/c3/firmware.bin release/firmware.bin
          cp .pio/build/c3/bootloader.bin release/bootloader.bin
          cp .pio/build/c3/partitions.bin release/partitions.bin
          cp .pio/build/c3/littlefs.bin release/blocklist-fs.bin
          cp data/blocklist.bin release/blocklist.bin
          cp data/blocklist.bin.sig release/blocklist.bin.sig 2>/dev/null || true
          # Combined flashable image (bootloader + partitions + firmware + fs)
          # Offsets must match partitions.csv:
          #   bootloader: 0x0 (esptool default for C3)
          #   partitions: 0x8000
          #   firmware:   0x10000
          #   fs:         0x2b0000
          ESPTOOL=$(find ~/.platformio/packages -name esptool.py -path '*tool-esptoolpy*' | head -1)
          python3 "$ESPTOOL" --chip esp32c3 merge_bin -o release/full-flash.bin \
            --flash_mode dio --flash_size 4MB \
            0x0 release/bootloader.bin \
            0x8000 release/partitions.bin \
            0x10000 release/firmware.bin \
            0x2b0000 release/blocklist-fs.bin
          ls -lh release/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/firmware.bin
            release/bootloader.bin
            release/partitions.bin
            release/blocklist-fs.bin
            release/blocklist.bin*
            release/full-flash.bin
